name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - name: prek（フック一式を全ファイルに適用）
        run: prek run --all-files --show-diff-on-failure
      - name: gitleaks（履歴全体）
        run: gitleaks git --redact --no-banner .
      - name: zizmor（オンライン監査。SHA とタグ注釈のずれを見る）
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - name: init / validate（Docker は不要）
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: plan の構文確認（provider に接続しないためテンプレート描画のみ）
        working-directory: terraform
        env:
          TF_VAR_grafana_admin_password: ci-only-placeholder-value
        run: terraform fmt -check -recursive
