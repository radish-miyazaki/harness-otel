# ツールはすべてここに閉じ込め、グローバル環境には入れない
[tools]
terraform = "1.14.9"
tflint = "0.61.0"
terraform-docs = "0.24.0"
prek = "0.5.0"
gitleaks = "8.30.1"
uv = "0.10.7"
"pipx:ryl" = "0.21.0"
rumdl = "0.2.62"
tombi = "1.4.1"
shellcheck = "0.11.0"
actionlint = "1.7.12"
jq = "1.8.1"
zizmor = "1.29.0"

[env]
_.file = ".env"

[tasks.init]
description = "Terraform 初期化"
dir = "terraform"
run = "terraform init"

[tasks.plan]
description = "変更内容の確認"
dir = "terraform"
run = "terraform plan"

[tasks.apply]
description = "スタックを起動（Collector / Prometheus / Loki / Grafana）"
dir = "terraform"
run = "terraform apply"

[tasks.destroy]
description = "スタックを停止・削除（ボリュームは残る）"
dir = "terraform"
run = "terraform destroy"

[tasks.lint]
description = "prek で全ファイルを検査"
run = "prek run --all-files"

[tasks.smoke]
description = "OTLP 疎通と Prometheus/Loki への到達を確認"
run = "scripts/smoke-test.sh"

[tasks.hooks-install]
description = "Git フック（prek）を有効化"
run = "prek install"
