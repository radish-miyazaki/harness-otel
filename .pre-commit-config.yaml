# prek で実行する（pre-commit 互換）。導入: mise run hooks-install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: \.tftpl$
      - id: check-json
      - id: check-added-large-files
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
          - --tf-init-args=-backend=false
      - id: terraform_tflint
  # ryl と rumdl は mise で入れたものをそのまま使う（upstream のフック定義に依存しない）
  - repo: local
    hooks:
      - id: ryl
        name: ryl（YAML）
        entry: ryl -c .yamllint.yaml
        language: system
        types: [yaml]
        exclude: \.tftpl$
      - id: rumdl
        name: rumdl（Markdown）
        entry: rumdl check
        language: system
        types: [markdown]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
